<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guia de boas-vindas — Novo escritório ODATA</title>
<meta name="description" content="Restaurantes, padarias, mercados, academias, estacionamento e transporte perto do novo escritório da ODATA na Alameda Gabriel Monteiro da Silva, 2407.">
<link rel="icon" href="assets/odata-logo-white.svg">
<link rel="preload" href="fonts/Galatea-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/Galatea-Medium.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="site-header">
  <div class="shell">
    <a class="brand" href="#topo"><img src="assets/odata-logo-white.svg" alt="ODATA"></a>
    <div class="header-actions">
      <a class="btn btn-ghost" id="btn-lista-topo" href="#" target="_blank" rel="noopener" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 20l-6-3V4l6 3m0 13l6-3m-6 3V7m6 10l6 3V7l-6-3m0 13V4m0 0L9 7"/></svg>
        Lista no Maps
      </a>
      <a class="btn btn-primary" id="btn-rota" href="#" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 1118 0z"/><circle cx="12" cy="10" r="3"/></svg>
        Como chegar
      </a>
    </div>
  </div>
</header>

<section class="hero" id="topo">
  <div class="shell">
    <p class="pretitle">Guia de boas-vindas · Mudança de endereço</p>
    <h1>Nosso novo escritório</h1>
    <p class="address" id="hero-address"></p>
    <div class="hero-cta" id="hero-cta"></div>
  </div>
</section>

<div class="controls">
  <div class="shell">
    <label class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input type="search" id="busca" placeholder="Buscar" autocomplete="off">
    </label>
    <div class="chips" id="chips"></div>
  </div>
</div>

<main class="shell layout">
  <div class="list-col" id="lista"></div>
  <div class="map-col">
    <div id="map"></div>
    <p class="map-note" id="map-note"></p>
  </div>
</main>

<footer class="site-footer">
  <div class="shell">
    <img src="assets/odata-logo-white.svg" alt="ODATA">
    <p id="footnote"></p>
  </div>
</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
