<!DOCTYPE html>

<head>

<link rel="icon" href="assets/odata-logo-white.svg">
<link rel="preload" href="fonts/Galatea-Regular.woff2" as="font" type="font/woff2" crossorigin>

<body>

  <div class="shell">
    <label class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input type="search" id="busca" placeholder="Buscar" autocomplete="off">

<main class="shell layout">

  <div class="map-col">
    <div id="map"></div>
    <p class="map-note" id="map-note"></p>

<footer class="site-footer">

    <img src="assets/odata-logo-white.svg" alt="ODATA">

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
